<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Кофе-копилка">
<meta name="theme-color" content="#f2f3fb">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%236366f1'/%3E%3Ctext y='72' x='50' font-size='58' text-anchor='middle'%3E%E2%98%95%3C/text%3E%3C/svg%3E">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='84' font-size='84'%3E%E2%98%95%3C/text%3E%3C/svg%3E">
<title>Кофе-копилка</title>
<style>
  :root{
    --bg:#f2f3fb; --card:#ffffff; --card2:#eef0fa; --text:#1a1830; --muted:#767594; --line:#e2e4f3;
    --accent:#6366f1; --accent2:#818cf8; --good:#16a34a; --good2:#4ade80;
    --tapText:#ffffff; --barbg:#e7e9f7; --potTint:#eef0fd;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif; }
  body{ padding:max(16px,env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom)); max-width:520px; margin:0 auto; }
  h1{ font-size:20px; font-weight:800; margin:6px 0 2px; letter-spacing:.2px; }
  .sub{ color:var(--muted); font-size:13px; margin-bottom:16px; }
  .pot{ background:linear-gradient(160deg,var(--potTint),var(--card)); border:1px solid var(--line); border-radius:22px; padding:22px; text-align:center; margin-bottom:14px; box-shadow:0 8px 24px color-mix(in srgb,var(--accent) 10%, transparent); }
  .pot .label{ color:var(--muted); font-size:13px; }
  .pot .amount{ font-size:48px; font-weight:900; margin:2px 0; letter-spacing:-1.5px; color:var(--accent); }
  .pot .stats{ color:var(--muted); font-size:13px; margin-top:6px; }
  .tap{ width:100%; border:none; border-radius:18px; padding:20px; font-size:19px; font-weight:800; color:var(--tapText);
    background:linear-gradient(160deg,var(--accent2),var(--accent)); box-shadow:0 8px 22px color-mix(in srgb,var(--accent) 35%, transparent); cursor:pointer; margin-bottom:8px; transition:transform .07s; }
  .tap:active{ transform:scale(.97); }
  .undo{ width:100%; background:none; border:none; color:var(--muted); font-size:13px; padding:6px; cursor:pointer; margin-bottom:18px; }
  .undo:disabled{ opacity:.3; }
  .section-h{ display:flex; justify-content:space-between; align-items:center; margin:6px 2px 10px; }
  .section-h h2{ font-size:16px; font-weight:800; margin:0; }
  .section-h button{ background:none; border:1px solid var(--line); color:var(--muted); border-radius:10px; padding:5px 10px; font-size:13px; cursor:pointer; }
  .goal{ background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px; margin-bottom:10px; transition:.25s; }
  .goal.focus{ border-color:var(--accent); box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 18%, transparent); }
  .goal.reached{ border-color:var(--good); background:linear-gradient(160deg,color-mix(in srgb,var(--good) 12%, var(--card)),var(--card)); }
  .goal .top{ display:flex; justify-content:space-between; align-items:baseline; gap:8px; }
  .goal .name{ font-weight:700; font-size:15px; }
  .goal .price{ color:var(--muted); font-size:13px; white-space:nowrap; }
  .bar{ height:12px; background:var(--barbg); border-radius:7px; margin:10px 0 6px; overflow:hidden; }
  .bar > i{ display:block; height:100%; background:linear-gradient(90deg,var(--accent2),var(--accent)); border-radius:7px; transition:width .5s cubic-bezier(.2,.8,.2,1); box-shadow:0 0 10px color-mix(in srgb,var(--accent) 45%, transparent); }
  .goal.reached .bar > i{ background:linear-gradient(90deg,var(--good2),var(--good)); box-shadow:0 0 10px color-mix(in srgb,var(--good) 50%, transparent); }
  .goal .meta{ display:flex; justify-content:space-between; align-items:center; }
  .goal .pct{ color:var(--muted); font-size:12px; }
  .goal .tag{ font-size:11px; color:var(--accent); font-weight:800; text-transform:uppercase; letter-spacing:.5px; }
  .goal.reached .tag{ color:var(--good); }
  .buy{ background:var(--good); color:#fff; border:none; border-radius:10px; padding:7px 14px; font-weight:700; font-size:13px; cursor:pointer; }
  .buy:disabled{ display:none; }
  .del{ background:none; border:none; color:#b7405a; font-size:12px; cursor:pointer; padding:0; }
  .edit-row{ display:flex; gap:8px; align-items:center; margin-top:10px; }
  .edit-row .del{ margin-left:auto; }
  .mv{ background:var(--card2); border:1px solid var(--line); color:var(--text); border-radius:8px; width:34px; height:30px; font-size:15px; cursor:pointer; }
  .mv:disabled{ opacity:.35; }
  .add-row{ display:flex; gap:8px; margin-bottom:12px; }
  .add-row input{ background:var(--card2); border:1px solid var(--line); color:var(--text); border-radius:12px; padding:11px; font-size:15px; width:100%; }
  .add-row input.price{ max-width:110px; }
  .add-row button{ background:var(--accent); color:#fff; border:none; border-radius:12px; padding:0 16px; font-weight:800; font-size:20px; cursor:pointer; }
  .bought{ color:var(--muted); font-size:13px; padding:8px 2px; }
  .reset{ display:block; margin:14px auto 0; background:none; border:none; color:var(--muted); font-size:12px; cursor:pointer; opacity:.7; }
  .foot{ text-align:center; color:var(--muted); font-size:11px; margin-top:14px; line-height:1.5; }
  .hidden{ display:none; }
  #toast{ position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom)); transform:translateX(-50%) translateY(20px);
    background:var(--accent); color:#fff; padding:12px 18px; border-radius:14px; font-weight:700; font-size:14px;
    opacity:0; transition:.3s; pointer-events:none; z-index:9; box-shadow:0 8px 22px color-mix(in srgb,var(--accent) 35%, transparent); }
  #toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>
  <h1>☕ → 🎁 Кофе-копилка</h1>
  <div class="sub">Не выпил кофе → +<span id="rewardTxt">500</span> ₽ в копилку на вещь из вишлиста.</div>

  <div class="pot">
    <div class="label">Накоплено</div>
    <div class="amount"><span id="pot">0</span> ₽</div>
    <div class="stats">Пропущено чашек: <b id="cups">0</b> · сегодня: <b id="today">0</b></div>
  </div>

  <button class="tap" id="tapBtn">Не выпил кофе &nbsp;+<span id="rewardBtn">500</span> ₽</button>
  <button class="undo" id="undoBtn" disabled>↩︎ упс, отменить последнее</button>

  <div class="section-h">
    <h2>🎁 Цели</h2>
    <button id="editBtn">Править</button>
  </div>

  <div id="addBox" class="hidden">
    <div class="add-row">
      <input id="gName" placeholder="Название вещи" />
      <input id="gPrice" class="price" placeholder="₽" inputmode="numeric" />
      <button id="gAdd">+</button>
    </div>
  </div>

  <div id="goals"></div>

  <div id="boughtBox" class="bought"></div>

  <button class="reset" id="resetBtn">↺ Сбросить прогресс</button>

  <div class="foot">
    Данные хранятся только на этом устройстве. Цены в целях — примерные, поправь под свои.<br>
    Экономия +500 за чашку · дальше ужесточим до «за день без кофе».
  </div>

  <div id="toast"></div>

<script>
(function(){
  const KEY = 'coffeeJar.v2';
  const DEF = {
    reward: 500,
    pot: 0,
    everSaved: 0,
    cups: 0,
    days: {},
    log: [],
    goals: [
      { id:1, name:'Sky Team «Крутое пике»', price:1700 },
      { id:2, name:'Baseus зарядка 67W (EnerCore CJ11)', price:3000 },
      { id:3, name:'Anker повербанк 5000мАч (A1665)', price:4000 },
      { id:4, name:'Logitech Keys to Go 2', price:7000 },
      { id:5, name:'Logitech Mobi Fold (мышь)', price:7200 }
    ],
    bought: []
  };
  let S = load();

  function load(){ try{ const r = JSON.parse(localStorage.getItem(KEY)); return r ? Object.assign({}, DEF, r) : structuredClone(DEF); }catch(e){ return structuredClone(DEF); } }
  function save(){ localStorage.setItem(KEY, JSON.stringify(S)); }
  function today(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
  function fmt(n){ return n.toLocaleString('ru-RU'); }
  const $ = s => document.querySelector(s);

  function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),1900); }

  function render(){
    $('#pot').textContent = fmt(S.pot);
    $('#cups').textContent = S.cups;
    $('#today').textContent = S.days[today()] || 0;
    $('#rewardTxt').textContent = S.reward;
    $('#rewardBtn').textContent = S.reward;
    $('#undoBtn').disabled = S.log.length === 0;

    const goals = S.goals;
    let focusId = null, minPrice = Infinity;
    for(const g of goals){ if(S.pot < g.price && g.price < minPrice){ minPrice = g.price; focusId = g.id; } }

    const box = $('#goals'); box.innerHTML='';
    goals.forEach((g,idx)=>{
      const reached = S.pot >= g.price;
      const pct = Math.min(100, Math.round(S.pot / g.price * 100));
      const left = Math.max(0, g.price - S.pot);
      const el = document.createElement('div');
      el.className = 'goal' + (reached ? ' reached' : (g.id===focusId ? ' focus' : ''));
      el.innerHTML =
        '<div class="top"><span class="name">'+esc(g.name)+'</span><span class="price">'+fmt(g.price)+' ₽</span></div>'+
        '<div class="bar"><i style="width:'+pct+'%"></i></div>'+
        '<div class="meta">'+
          '<span class="pct">'+(reached?'<span class="tag">✓ можно покупать</span>':(g.id===focusId?'<span class="tag">ближайшая</span> ':'')+'осталось '+fmt(left)+' ₽ · '+pct+'%')+'</span>'+
          (reached?'<button class="buy" data-buy="'+g.id+'">Купить</button>':'')+
        '</div>'+
        (editMode?'<div class="edit-row"><button class="mv" data-up="'+g.id+'"'+(idx===0?' disabled':'')+'>↑</button><button class="mv" data-down="'+g.id+'"'+(idx===goals.length-1?' disabled':'')+'>↓</button><button class="del" data-del="'+g.id+'">удалить</button></div>':'');
      box.appendChild(el);
    });

    const bb=$('#boughtBox');
    if(S.bought.length){ bb.innerHTML = '✅ Куплено: ' + S.bought.map(b=>esc(b.name)).join(' · '); }
    else bb.innerHTML='';

    $('#addBox').classList.toggle('hidden', !editMode);
    $('#editBtn').textContent = editMode ? 'Готово' : 'Править';
  }
  function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
  function moveGoal(id, dir){ const i=S.goals.findIndex(x=>String(x.id)===String(id)); if(i<0)return; const j=i+dir; if(j<0||j>=S.goals.length)return; const t=S.goals[i]; S.goals[i]=S.goals[j]; S.goals[j]=t; save(); render(); }

  let editMode=false;

  $('#tapBtn').addEventListener('click', ()=>{
    S.pot += S.reward; S.everSaved += S.reward; S.cups += 1;
    const d=today(); S.days[d]=(S.days[d]||0)+1;
    S.log.push({t:Date.now(), amount:S.reward});
    if(S.log.length>50) S.log.shift();
    save(); render(); toast('+'+S.reward+' ₽ ☕️ молодец!');
    if(navigator.vibrate) navigator.vibrate(15);
  });

  $('#undoBtn').addEventListener('click', ()=>{
    const last = S.log.pop(); if(!last) return;
    S.pot=Math.max(0,S.pot-last.amount); S.everSaved=Math.max(0,S.everSaved-last.amount); S.cups=Math.max(0,S.cups-1);
    const d=today(); if(S.days[d]) S.days[d]=Math.max(0,S.days[d]-1);
    save(); render(); toast('отменено −'+last.amount+' ₽');
  });

  $('#editBtn').addEventListener('click', ()=>{ editMode=!editMode; render(); });

  $('#resetBtn').addEventListener('click', ()=>{
    if(!confirm('Сбросить весь прогресс? Копилка, чашки и покупки обнулятся. Цели останутся.')) return;
    S.pot=0; S.everSaved=0; S.cups=0; S.days={}; S.log=[]; S.bought=[];
    save(); render(); toast('сброшено — с чистого листа ☕️');
  });

  $('#gAdd').addEventListener('click', ()=>{
    const name=$('#gName').value.trim(); const price=parseInt($('#gPrice').value.replace(/\D/g,''),10);
    if(!name||!price){ toast('впиши название и цену'); return; }
    S.goals.push({ id:Date.now(), name, price }); save();
    $('#gName').value=''; $('#gPrice').value=''; render();
  });

  $('#goals').addEventListener('click', e=>{
    const buy=e.target.getAttribute('data-buy'); const del=e.target.getAttribute('data-del');
    const up=e.target.getAttribute('data-up'); const down=e.target.getAttribute('data-down');
    if(up){ moveGoal(up,-1); return; }
    if(down){ moveGoal(down,1); return; }
    if(buy){
      const g=S.goals.find(x=>String(x.id)===buy); if(!g) return;
      if(!confirm('Купить «'+g.name+'» за '+fmt(g.price)+' ₽? Спишется из копилки.')) return;
      S.pot-=g.price; S.bought.unshift({name:g.name, price:g.price, t:Date.now()});
      S.goals=S.goals.filter(x=>String(x.id)!==buy); S.log=[]; save(); render(); toast('🎉 куплено! наслаждайся');
    }
    if(del){
      S.goals=S.goals.filter(x=>String(x.id)!==del); save(); render();
    }
  });
  render();
})();
</script>
</body>
</html>
